<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>🌱 Chatbot BiAgros</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #005E50, #1E9B97, #6FA997);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
      color: #fff;
    }

    @keyframes gradientMove {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    h2 {
      margin: 20px;
      color: #ffffff;
      font-size: 28px;
      text-shadow: 1px 1px 4px #000;
    }

    #chat {
      width: 90%;
      max-width: 800px;
      margin: 0 auto 20px auto;
      background: #ffffff;
      color: #000;
      border-radius: 12px;
      padding: 20px;
      height: 400px;
      overflow-y: auto;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    #chat p {
      margin: 10px 0;
      line-height: 1.5;
    }

    #userInput {
      width: 90%;
      max-width: 800px;
      margin: 0 auto 30px auto;
      display: flex;
      gap: 10px;
    }

    #message {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }

    #sendBtn {
      padding: 12px 24px;
      background-color: #005E50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    #sendBtn:hover {
      background-color: #1E9B97;
    }

    .user {
      color: #005E50;
      font-weight: bold;
    }

    .bot {
      color: #1E9B97;
    }

    ::placeholder {
      color: #999;
    }
  </style>
</head>
<body>

  <h2>🌱 Chatbot BiAgros</h2>
  <div id="chat"></div>

  <div id="userInput">
    <input type="text" id="message" placeholder="Digite sua pergunta..." />
    <button id="sendBtn">Enviar</button>
  </div>

  <script>
    const webhookUrl = "https://n8n-3low.onrender.com/webhook/6fd683ee-558f-473f-9316-dfc57967f434";

    const chat = document.getElementById("chat");
    const messageInput = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");

    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    function appendMessage(text, sender) {
      const msg = document.createElement("p");
      msg.className = sender;
      msg.innerHTML = `<strong>${sender === 'user' ? 'Você' : 'Bot'}:</strong> ${text}`;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      messageInput.value = "";

      try {
        const res = await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chatInput: text })
        });

        const resposta = await res.text();
        appendMessage(resposta || "❌ Erro: output vazia.", "bot");

      } catch (err) {
        appendMessage("Erro ao se comunicar com o servidor 😢", "bot");
      }
    }
  </script>
</body>
</html>
