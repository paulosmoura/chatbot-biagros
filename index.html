<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>🌱 Chatbot BiAgros</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h2 {
      margin-top: 20px;
    }
    #chat {
      width: 90%;
      max-width: 800px;
      margin: 30px auto;
      background: white;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 20px;
      height: 400px;
      overflow-y: auto;
      text-align: left;
    }
    #chat p {
      margin: 10px 0;
    }
    #userInput {
      width: 90%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      padding: 20px;
    }
    #message {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    #sendBtn {
      padding: 10px 20px;
      font-size: 16px;
    }
    .user { color: blue; }
    .bot { color: green; }
  </style>
</head>
<body>

  <h2>🌱 Chatbot BiAgros</h2>
  <div id="chat"></div>

  <div id="userInput">
    <input type="text" id="message" placeholder="Digite sua pergunta..." />
    <button id="sendBtn">Enviar</button>
  </div>

  <script>
    const webhookUrl = "https://n8n-3low.onrender.com/webhook/6fd683ee-558f-473f-9316-dfc57967f434";

    const chat = document.getElementById("chat");
    const messageInput = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");

    sendBtn.addEventListener("click", sendMessage);
    messageInput.addEventListener("keypress", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    function appendMessage(text, sender) {
      const msg = document.createElement("p");
      msg.className = sender;
      msg.innerHTML = `<strong>${sender === 'user' ? 'Você' : 'Bot'}:</strong> ${text}`;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      messageInput.value = "";

      try {
        const res = await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chatInput: text })
        });

        const resposta = await res.text(); // <- TEXT response, not JSON
        appendMessage(resposta || "❌ Erro: resposta vazia.", "bot");

      } catch (err) {
        appendMessage("Erro ao se comunicar com o servidor 😢", "bot");
      }
    }
  </script>
</body>
</html>
