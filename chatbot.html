<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chatbot BiAgros</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
    }
    #chatbox {
      width: 90%;
      max-width: 600px;
      height: 500px;
      border: 1px solid #ccc;
      background: white;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 20px;
    }
    .msg {
      margin: 10px 0;
    }
    .user {
      color: blue;
    }
    .bot {
      color: green;
    }
    input[type="text"] {
      width: 80%;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>🤖 Chatbot BiAgros</h2>
  <div id="chatbox"></div>
  <input type="text" id="userInput" placeholder="Digite sua pergunta..." />
  <button onclick="sendMessage()">Enviar</button>

  <script>
    const webhookUrl = "https://SEU-N8N-RENDER.onrender.com/webhook/chatbot";

    function appendMessage(sender, text) {
      const chatbox = document.getElementById("chatbox");
      const msg = document.createElement("div");
      msg.className = "msg " + sender;
      msg.textContent = (sender === 'user' ? 'Você: ' : 'Bot: ') + text;
      chatbox.appendChild(msg);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const question = input.value;
      if (!question.trim()) return;

      appendMessage("user", question);
      input.value = "";

      try {
        const response = await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chatInput: question })
        });
        const data = await response.json();
        appendMessage("bot", data.resposta || "(sem resposta)");
      } catch (error) {
        appendMessage("bot", "Erro ao se comunicar com o servidor :(");
      }
    }
  </script>
</body>
</html>
